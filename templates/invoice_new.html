{% extends "base.html" %}
{% block title %}Generate Invoice{% endblock %}
{% block content %}
<h2 class="mb-4">Generate Invoice</h2>
<form method="POST" action="{{ url_for('new_invoice') }}">
    <div class="card mb-4">
        <div class="card-body">
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Client Name</label>
                    <input type="text" name="client_name" class="form-control" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Client Email</label>
                    <input type="email" name="client_email" class="form-control">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Client Company</label>
                    <input type="text" name="client_company" class="form-control">
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Due Date</label>
                    <input type="date" name="due_date" class="form-control">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Tax Rate (%)</label>
                    <input type="number" step="0.01" name="tax_rate" class="form-control" value="0">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Notes</label>
                <textarea name="notes" class="form-control" rows="3"></textarea>
            </div>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>Invoice Items</span>
            <button type="button" class="btn btn-sm btn-outline-primary" id="addItemBtn">
                <i class="bi bi-plus"></i> Add Item
            </button>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table mb-0" id="itemsTable">
                    <thead>
                        <tr>
                            <th style="width: 50%">Description</th>
                            <th style="width: 15%">Qty</th>
                            <th style="width: 20%">Unit Price</th>
                            <th style="width: 15%"></th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for _ in range(3) %}
                        <tr>
                            <td><input type="text" name="item_description" class="form-control"></td>
                            <td><input type="number" step="0.01" min="0" name="item_quantity" class="form-control"></td>
                            <td><input type="number" step="0.01" min="0" name="item_price" class="form-control"></td>
                            <td class="text-end">
                                <button type="button" class="btn btn-sm btn-outline-danger removeItemBtn">
                                    <i class="bi bi-x"></i>
                                </button>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="d-flex gap-2">
        <a href="{{ url_for('invoices') }}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">Generate Invoice</button>
    </div>
</form>

<script>
    const itemsTable = document.getElementById('itemsTable').querySelector('tbody');
    const addItemBtn = document.getElementById('addItemBtn');

    addItemBtn.addEventListener('click', () => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td><input type="text" name="item_description" class="form-control"></td>
            <td><input type="number" step="0.01" min="0" name="item_quantity" class="form-control"></td>
            <td><input type="number" step="0.01" min="0" name="item_price" class="form-control"></td>
            <td class="text-end">
                <button type="button" class="btn btn-sm btn-outline-danger removeItemBtn">
                    <i class="bi bi-x"></i>
                </button>
            </td>
        `;
        itemsTable.appendChild(row);
    });

    document.addEventListener('click', (event) => {
        if (event.target.closest('.removeItemBtn')) {
            const row = event.target.closest('tr');
            if (itemsTable.children.length > 1) {
                row.remove();
            }
        }
    });
</script>
{% endblock %}
